<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>MOKADU — Próximamente · Bilbao</title>
  <link rel="icon" type="image/png" href="img/logo-m.png">
  <style>
    @font-face {
      font-family: 'Bebas Neue';
      src: url('fonts/BebasNeue-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      src: url('fonts/BricolageGrotesque-Light.ttf') format('truetype');
      font-weight: 300;
      font-display: swap;
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      src: url('fonts/BricolageGrotesque-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #fdf8f0;
      --fg:    #1c0805;
      --muted: #7a5c45;
      --red:   #cc1c1c;
      --border:#e8d5c0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Layout ── */
    .page {
      height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 2rem 2.5rem;
    }

    /* ── Top bar ── */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.1s forwards;
    }

    .top-logo img {
      height: 22px;
      width: auto;
      display: block;
    }

    .top-tag {
      font-size: 0.58rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 400;
    }

    /* ── Centro ── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0;
      position: relative;
    }

    .circle {
      width: clamp(100px, 16vw, 160px);
      height: clamp(100px, 16vw, 160px);
      border-radius: 50%;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: clamp(2rem, 5vh, 3.5rem);
      padding: 1.6rem;
      opacity: 0;
      animation: scaleIn 0.9s cubic-bezier(0.25,0.46,0.45,0.94) 0.3s forwards;
      box-shadow: 0 20px 60px rgba(204,28,28,0.18);
    }

    .circle img {
      width: 80%;
      filter: brightness(0) invert(1);
    }

    .headline {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: clamp(4.5rem, 14vw, 13rem);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: 0.01em;
      color: var(--fg);
      text-transform: uppercase;
      opacity: 0;
      animation: slideUp 0.9s cubic-bezier(0.25,0.46,0.45,0.94) 0.5s forwards;
    }

    .headline em {
      font-style: normal;
      color: var(--red);
    }

    .sub {
      margin-top: clamp(1.2rem, 3vh, 2rem);
      font-size: clamp(0.78rem, 1.6vw, 1rem);
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.04em;
      line-height: 1.7;
      max-width: 38ch;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.85s forwards;
    }

    /* ── Bottom bar ── */
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      opacity: 0;
      animation: fadeIn 0.8s ease 1.1s forwards;
    }

    .bottom-address {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.7;
    }

    .bottom-links {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .bottom-links a {
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fg);
      text-decoration: none;
      font-weight: 400;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.15rem;
      transition: color 0.3s, border-color 0.3s;
    }
    .bottom-links a:hover { color: var(--red); border-color: var(--red); }

    /* ── Línea decorativa fondo ── */
    .deco-line {
      position: fixed;
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      background: var(--border);
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Animaciones ── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Móvil ── */
    @media (max-width: 600px) {
      .page { padding: 1.5rem; overflow: hidden; }
      .top-tag { display: none; }
      .bottom { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .bottom-links { align-items: flex-start; }
      .deco-line { display: none; }
    }
  </style>
</head>
<body>

  <div class="deco-line" aria-hidden="true"></div>

  <div class="page">

    <header class="top">
      <a href="#" class="top-logo" aria-label="Mokadu">
        <img src="img/logo-negro.png" alt="Mokadu">
      </a>
      <span class="top-tag">Bilbao · Licenciado Poza, 34</span>
    </header>

    <main class="center">
      <div class="circle">
        <img src="img/logo-negro.png" alt="Mokadu">
      </div>
      <h1 class="headline">Próxi<em>-</em><br>mamente</h1>
      <p class="sub">Algo bueno se está cocinando.<br>Mientras, encuéntranos en Instagram.</p>
    </main>

    <footer class="bottom">
      <address class="bottom-address" style="font-style:normal;">
        Licenciado Poza, 34<br>
        48009 Bilbao
      </address>
      <nav class="bottom-links">
        <a href="https://www.instagram.com/mokadubilbao" target="_blank" rel="noopener noreferrer">@mokadubilbao</a>
        <a href="https://wa.me/34621011201" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      </nav>
    </footer>

  </div>

</body>
</html>
